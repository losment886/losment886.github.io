<header class="header">
    <div style="display: flex; align-items: center; gap: 8px;">
        <img src="../res/logo_alpha.png" style="width: 30px; height: 30px; cursor: pointer;" onclick="window.location.href = './index.html';" />
        <div style="cursor: pointer; font-weight: 500;" onclick="window.location.href = './index.html';">lofusoft</div>
    </div>
    <div style="display: flex; align-items: center; gap: 20px;">
        <div style="cursor: pointer;" onclick="window.location.href = './products.html';">Products</div>
        <div style="cursor: pointer;" onclick="window.location.href = './about.html';">About</div>
        <div style="cursor: pointer;" onclick="Trn()">EN</div>
        <div id="theme-toggle" style="cursor: pointer; font-size: 1.2rem;">🌙</div>
    </div>
    <script>
        function  Trn ()
        {
            localStorage.setItem('chosenLanguage','en');
            
            if(window.location.href.indexOf('ProductInfo/index.html') < 0)
            {
                if(window.location.href.indexOf('index') < 0)
                {
                    window.location.href = '../../en/index.html?href=index.html';
                }
                else if(window.location.href.indexOf('about.html') < 0)
                {
                    window.location.href = '../../en/index.html?href=about.html';
                }
                else if(window.location.href.indexOf('products.html') < 0)
                {
                    window.location.href = '../../en/index.html?href=products.html';
                }
            }
            else
            {
                window.location.href = '../../index.html?href=' + window.location.href.substring(window.location.href.indexOf('ProductInfo/index.html'));
            }
        }
    </script>
</header>
